<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="Image/pomodoro-icon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <!--Font Google-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />

    <script
      defer
      src="https://kit.fontawesome.com/0acb75a9e8.js"
      crossorigin="anonymous"
    ></script>
    <title>Pomodoro</title>
  </head>
  <body>
    <header>
      <h1>Pomodoro Timer</h1>
    </header>
    <main>
      <div class="box">
        <p id="work" class="active">Travail</p>
        <p id="break">Pause</p>
      </div>

      <!--Timer-->
      <section id="container">
        <div id="Timer" aria-live="polite">
          <p id="minutes"></p>
          <p>:</p>
          <p id="secondes"></p>
        </div>
      </section>

      <!--settings-->
      <section id="configuration">
        <h2>Configuration du Timer</h2>
        <div class="divinput">
          <div id="travail1">
            <label id="travail" for="minutesW">Minutes de travail:</label><br />
            <input
              type="number"
              id="minutesW"
              name="minutesW"
              min="0"
              placeholder="25"
              autocomplete="off"
              aria-label="Minutes de travail"
            />
            <br />
            <label id="travail" for="secondesW">Secondes de travail:</label
            ><br />
            <input
              type="number"
              id="secondesW"
              name="secondesW"
              min="0"
              placeholder="00"
              autocomplete="off"
              aria-label="Secondes de travail"
            />
          </div>
          <div id="pause1">
            <label id="pause" for="minutesB">Minutes de pause:</label><br />
            <input
              type="number"
              id="minutesB"
              name="minutesB"
              min="0"
              placeholder="5"
              aria-label="Minutes de pause"
            />
            <br />
            <label id="pause" for="secondesB">Secondes de pause:</label><br />
            <input
              type="number"
              id="secondesB"
              name="secondesB"
              min="0"
              placeholder="00"
              aria-label="Secondes de pause"
            />
          </div>
        </div>
        <div id="divValide">
          <button id="valider" aria-label="Enregistrer le temps">
            Enregistrer le temps
          </button>
        </div>
      </section>

      <div class="controls">
        <button id="start" aria-label="Démarrer le minuteur">
          <i class="fa-solid fa-play"></i>
        </button>

        <button id="reset" aria-label="Réinitialiser le minuteur">
          <i class="fa-solid fa-rotate-right"></i>
        </button>

        <button id="settings" aria-label="Paramètres du minuteur">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </main>
    <script defer src="js/script.js"></script>
  </body>
</html>
